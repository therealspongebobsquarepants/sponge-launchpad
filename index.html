<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sponge Launchpad</title>
  <style>
    :root{--bg:#f7f8fa;--card:#fff;--text:#1f2937;--muted:#6b7280;--brand:#4f46e5;}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial, sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:48px 20px}
    header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
    header .logo{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:var(--brand);color:white;font-weight:bold}
    h1{font-size:2rem;margin:0}
    .subtitle{color:var(--muted);margin-top:6px}
    .hero{display:flex;gap:20px;flex-wrap:wrap}
    .card{background:var(--card);border:1px solid #e5e7eb;border-radius:12px;padding:20px;flex:1 1 320px;min-width:260px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
    .cta{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--brand);color:white;text-decoration:none;font-weight:600}
    .svg{flex:0 0 180px}
    @media (max-width:700px){
      .svg{order:-1;width:100%;height:180px;display:block}
      .hero{flex-direction:column}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">SL</div>
      <div>
        <h1>Sponge Launchpad</h1>
        <div class="subtitle">A minimal GitHub Pages landing page for Sponge Launchpad</div>
      </div>
    </header>
    <div class="hero">
      <div class="card" aria-label="intro">
        <p>Welcome to Sponge Launchpad. This page is served from GitHub Pages and links to the repository.</p>
        <p><a href="https://github.com/therealspongebobsquarepants/sponge-launchpad" target="_blank" rel="noopener">View the repository on GitHub</a></p>
        <a class="cta" href="https://github.com/therealspongebobsquarepants/sponge-launchpad" target="_blank" rel="noopener">Go to Repo</a>
      </div>
      <div class="card svg" aria-label="decorative image">
        <!-- Inline SVG to keep it lightweight and self-contained -->
        <svg viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-label="Sponge artwork">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="#6ee7b7" offset="0"/>
              <stop stop-color="#3b82f6" offset="1"/>
            </linearGradient>
          </defs>
          <rect width="600" height="360" fill="#eef2ff"/>
          <circle cx="100" cy="80" r="60" fill="url(#g)" opacity="0.6"/>
          <circle cx="260" cy="180" r="90" fill="url(#g)" opacity="0.4"/>
          <text x="300" y="190" text-anchor="middle" font-family="Arial" font-size="28" fill="#111">Sponge Launchpad</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
